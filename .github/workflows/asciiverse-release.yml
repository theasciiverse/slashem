# Builds SLASH'EM for the Asciiverse catalog and as system packages.
#
# For av: one archive per target, named slashem-<target>.tar.gz, plus a
# SHA256SUMS file, attached to a GitHub release (hub/catalog/SCHEMA.md,
# release.source = "github"). Each archive holds the slashem program, the
# data libraries it reads beside itself (nhshare, nhushare), the licence,
# the Guidebook, our README and PATCHES.md.
# For everyone else: .deb, .rpm, .apk and Arch packages from the same static
# Linux build, made by nfpm (asciiverse/nfpm.yaml).
#
# Tags look like v0.0.8E0F1-av.1: the SLASH'EM release, then our packaging
# release. Linux builds are fully static (Alpine, musl, ncurses); macOS
# links the system ncurses. tty interface only. No Windows build (see
# PATCHES.md).

name: asciiverse-release

on:
  push:
    tags: ["*-av.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "existing tag to build and release"
        required: true

env:
  ID: slashem
  TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: write

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, runner: ubuntu-24.04, arch: amd64 }
          - { target: aarch64-unknown-linux-musl, runner: ubuntu-24.04-arm, arch: arm64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Build
        run: |
          docker run --rm -v "$PWD":/src -w /src alpine:3.22 sh -c '
            apk add --no-cache build-base ncurses-dev ncurses-static flex bison linux-headers >/dev/null &&
            LDFLAGS=-static asciiverse/build.sh'
          sudo chown -R "$(id -u):$(id -g)" .
          file out/slashem
          file out/slashem | grep -q "statically linked"
          sh asciiverse/stage.sh

      - name: Smoke test
        run: |
          # the program must find its data beside itself and start a game
          here=$PWD
          (cd /tmp && script -qec "TERM=xterm LANG=C.UTF-8 HOME=/tmp/h USER=player timeout 5 $here/stage/slashem -u Freya -p Valkyrie" /dev/null </dev/null || true) >smoke.log
          grep -aq "SuperLotsoAddedStuffHack" smoke.log || { tail -c 2000 smoke.log; exit 1; }
          ls /tmp/h/.local/state/slashem

      - name: Package for av
        run: |
          mkdir -p dist
          tar -czf "dist/$ID-${{ matrix.target }}.tar.gz" -C stage .

      - name: System packages
        run: |
          v="${TAG#v}"; v="${v%%-av.*}"; export VERSION="$v" RELEASE="${TAG##*-av.}" ARCH="${{ matrix.arch }}"
          for p in deb rpm apk archlinux; do
            docker run --rm -u "$(id -u):$(id -g)" -v "$PWD":/src -w /src \
              -e VERSION -e RELEASE -e ARCH goreleaser/nfpm:v2.43.0 \
              package --config asciiverse/nfpm.yaml --packager "$p" --target dist/
          done
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          # each on its own architecture's runner: the build runs the
          # tools it compiles (makedefs, the level compilers, dlb)
          - { target: x86_64-apple-darwin, arch: x86_64, runner: macos-15-intel }
          - { target: aarch64-apple-darwin, arch: arm64, runner: macos-15 }
    runs-on: ${{ matrix.runner }}
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Build
        run: |
          CC="cc -arch ${{ matrix.arch }}" sh asciiverse/build.sh
          file out/slashem
          otool -L out/slashem
          sh asciiverse/stage.sh

      - name: Package
        run: |
          mkdir -p dist
          tar -czf "dist/$ID-${{ matrix.target }}.tar.gz" -C stage .

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*

  release:
    needs: [linux, macos]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS && cat SHA256SUMS

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" -R "$GITHUB_REPOSITORY" --title "SLASH'EM $TAG" \
                 --notes "SLASH'EM ${TAG%%-av.*} by the SLASH'EM development team, the tty (terminal) build for the Asciiverse catalog, with .deb, .rpm, .apk and Arch packages. See PATCHES.md."
          gh release upload "$TAG" dist/* -R "$GITHUB_REPOSITORY" --clobber
